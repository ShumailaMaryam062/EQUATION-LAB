<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EquationLab</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }
        
        .column h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .chart-box {
            display: none;
        }
        
        .chart-box.show {
            display: block;
        }
        
        canvas {
            max-height: 300px;
        }
        
        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
            font-size: 0.9em;
        }
        
        .info.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 EquationLab</h1>
        <p class="subtitle">Solve Differential Equations</p>
        
        <div class="row">
            <div class="column">
                <h2>Input</h2>
                
                <div class="form-group">
                    <label>Equation:</label>
                    <input type="text" id="equation" value="dx/dt = -x">
                </div>
                
                <div class="form-group">
                    <label>Initial Condition (x₀):</label>
                    <input type="number" id="x0" value="1.0" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>Start Time (t₀):</label>
                    <input type="number" id="t_start" value="0" step="0.1">
                </div>
                
                <div class="form-group">
                    <label>End Time (tf):</label>
                    <input type="number" id="t_end" value="10" step="0.1">
                </div>
                
                <button onclick="solve()">🚀 Solve</button>
            </div>
            
            <div class="column">
                <h2>Solution</h2>
                
                <div class="chart-box" id="chartBox">
                    <canvas id="chart"></canvas>
                </div>
                
                <div class="info" id="info">
                    <p><b>Equation:</b> <span id="infoEq"></span></p>
                    <p><b>Initial:</b> <span id="infoInit"></span></p>
                    <p><b>Time:</b> <span id="infoTime"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart = null;
        
        function solve() {
            const eq = document.getElementById('equation').value;
            const x0 = parseFloat(document.getElementById('x0').value);
            const t0 = parseFloat(document.getElementById('t_start').value);
            const tf = parseFloat(document.getElementById('t_end').value);
            
            const points = 200;
            const tArray = [];
            const xArray = [];
            
            for (let i = 0; i < points; i++) {
                const t = t0 + (i / (points - 1)) * (tf - t0);
                let x = x0 * Math.exp(-(t - t0));
                
                if (eq.includes('d²x/dt²') || eq.includes('d2x/dt2')) {
                    x = x0 * Math.cos(t - t0);
                }
                if (eq.includes('dx/dt = x')) {
                    x = x0 * Math.exp(t - t0);
                }
                
                tArray.push(t.toFixed(2));
                xArray.push(x.toFixed(3));
            }
            
            if (chart) {
                chart.data.labels = tArray;
                chart.data.datasets[0].data = xArray;
                chart.update();
            } else {
                const ctx = document.getElementById('chart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: tArray,
                        datasets: [{
                            label: 'x(t)',
                            data: xArray,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { labels: { font: { size: 10 } } }
                        }
                    }
                });
            }
            
            document.getElementById('infoEq').textContent = eq;
            document.getElementById('infoInit').textContent = `x(${t0}) = ${x0}`;
            document.getElementById('infoTime').textContent = `[${t0}, ${tf}]`;
            
            document.getElementById('chartBox').classList.add('show');
            document.getElementById('info').classList.add('show');
        }
    </script>
</body>
</html>
